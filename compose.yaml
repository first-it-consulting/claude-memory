# Production-like stack for claude-memory. Bring your own Ollama (LLM +
# nomic-embed-text embeddings). Copy to a server, set the env vars below
# (or in a .env file next to it) and:
#   docker compose up -d --build
name: claude-memory
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # No published ports on purpose: only the server container talks to the
    # db. That is why the dev-default POSTGRES_PASSWORD below is acceptable;
    # set your own if you ever publish 5432.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mem0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mem0}
      POSTGRES_DB: ${POSTGRES_DB:-mem0}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./compose-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mem0}"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build: .
    image: claude-memory:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mem0}:${POSTGRES_PASSWORD:-mem0}@postgres:5432/${POSTGRES_DB:-mem0}
      # Bootstrap admin token (tenant "default", role admin). REQUIRED: create
      # it in .env (see .env.example) - it creates tenants and mints personal
      # tokens. An empty value disables the admin auth path entirely.
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env - copy .env.example}
      # Legacy shared token (tenant "default", role user) - deprecated, kept
      # for the migration path and for claude-memory-ui without Keycloak.
      # Empty (the default) disables this auth path; prefer personal tokens
      # from POST /api/me/tokens for everything that can send one.
      BEARER_TOKEN: ${BEARER_TOKEN:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      MEM0_TELEMETRY: "false"
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
