name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint - critical rules (syntax, undefined names, true bugs)
        run: ruff check --select E9,F63,F7,F82,I,F,E4,E7 src scripts tests adapters
      - name: Full-ruff report (informational, not a gate yet)
        run: ruff check --statistics src scripts tests adapters || true
      - name: Format gate
        run: ruff format --check src scripts tests adapters

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.15"]   # 3.15 = the Dockerfile's runtime
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mem0
          POSTGRES_PASSWORD: mem0
          POSTGRES_DB: mem0_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mem0"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mem0:mem0@localhost:5432/mem0_test
      REQUIRE_DB: "1"   # fail instead of silently skipping DB tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-dev.txt
      # Coverage floor = measured baseline (73%) minus 2; raise it as coverage grows.
      - run: python -m pytest --cov=src --cov-fail-under=71 --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.python == '3.13'
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  pi-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Typecheck adapters/pi/agent-memory.ts against the pi extension API
        run: |
          mkdir -p /tmp/pi && cp adapters/pi/agent-memory.ts /tmp/pi/ && cd /tmp/pi
          npm init -y >/dev/null
          npm install --no-audit --no-fund @earendil-works/pi-coding-agent typebox typescript @types/node
          npx tsc --noEmit --strict --target es2022 --module nodenext --moduleResolution nodenext \
            --skipLibCheck agent-memory.ts

  # End-to-end: real image + postgres/pgvector + deterministic Ollama stub.
  # asserts health/auth/tenants/PAT/MCP/write/search/isolation/sessions/queue
  # (tests/smoke.sh). Only embeddings + LLM extraction are faked.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Base compose.yaml requires ADMIN_TOKEN; the real container values come
    # from compose.test.yaml. This only satisfies the interpolation check.
    env:
      ADMIN_TOKEN: ci-interpolation-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: claude-memory:smoke
          build-args: VERSION=smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose up and smoke
        run: |
          docker compose -f compose.yaml -f compose.test.yaml up -d --wait
          bash tests/smoke.sh
      - name: Compose logs on failure
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.test.yaml logs > compose-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-dev.txt
      - name: Typecheck
        run: mypy src

  # Single stable check to require once branch protection/rulesets are available
  # (Free plan blocks them while private). Fails if any required job did not succeed.
  ci-success:
    runs-on: ubuntu-latest
    needs: [ruff, mypy, pytest, pi-extension, smoke]
    if: always()
    steps:
      - name: All required jobs succeeded?
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "job results: $RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled|skipped'; then
            echo "one or more required jobs did not succeed" >&2
            exit 1
          fi
